version = "3.11.5"
runner.dialect = scala3

maxColumn = 110
align.preset = some
docstrings.style = Asterisk
rewrite.rules = [RedundantBraces, RedundantParens, SortModifiers]
# Scala 3 syntax only, as -new-syntax asks of the compiler.
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = yes
# sbt 2 compiles build.sbt as Scala 3, so the build file follows the same syntax.
fileOverride { "glob:**/*.sbt" { runner.dialect = scala3 } }
