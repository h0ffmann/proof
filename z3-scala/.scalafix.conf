rules = [
  OrganizeImports,
  RemoveUnused,
  DisableSyntax,
  NoValInForComprehension,
  LeakingImplicitClassVal,
  NoAutoTupling
]

OrganizeImports {
  groupedImports = Merge
  removeUnused = true
  targetDialect = Scala3
}

DisableSyntax {
  noReturns = true
  noXml = true
  noFinalize = true
  noNulls = true
}
